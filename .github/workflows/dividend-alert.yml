name: Dividend Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-dividend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests

      - name: Check NSE for dividends
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python dividend_alert.py

      - name: Test Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python -c "import os, requests; r=requests.post('https://api.telegram.org/bot' + os.environ['BOT_TOKEN'] + '/sendMessage', data={'chat_id': os.environ['CHAT_ID'], 'text': '✅ GitHub Telegram Test - Dividend Alert Bot is connected!'}); print(r.status_code); print(r.text)"

      - name: Save seen announcements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f seen_dividends.json ]; then
            git add seen_dividends.json

            if ! git diff --cached --quiet; then
              git commit -m "Update dividend alerts"
              git push
            fi
          fi
